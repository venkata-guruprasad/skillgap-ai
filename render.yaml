# Render Blueprint for SkillGap AI FastAPI + AI/ML Backend
# Configured for Render Free Tier (512 MB RAM, $0/mo, no credit card) using
# lightweight TF-IDF semantic fallback + spaCy + trained 12-role Scikit-learn model.
# To enable full PyTorch + all-MiniLM-L6-v2 embeddings on a paid 2 GB Standard plan,
# set plan: standard, build arg INSTALL_MINILM=true, and ENABLE_SENTENCE_TRANSFORMERS=true.

services:
  - type: web
    name: skillgap-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_API_DOCS
        value: "true"
      - key: ENABLE_LOCAL_SQLITE_FALLBACK
        value: "false"
      - key: ENABLE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: UPLOAD_DIR
        value: /tmp/skillgap_uploads
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false # Set in Render dashboard from Neon PostgreSQL URI (?sslmode=require)
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        sync: false # Set to your exact Vercel domain, e.g. https://skillgap-ai.vercel.app
      - key: LLM_PROVIDER
        value: none # Optional: openai | gemini | none
      - key: LLM_API_KEY
        sync: false # Optional: set only if LLM_PROVIDER is openai or gemini
      - key: LLM_MODEL
        value: ""
