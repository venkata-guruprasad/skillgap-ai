# Render Blueprint for SkillGap AI FastAPI + AI/ML Backend
# Note: PyTorch + SentenceTransformers (all-MiniLM-L6-v2) + spaCy require at least 1-2 GB RAM.
# Render's 512 MB Free tier will OOM; use 'standard' (2 GB RAM) on Render or deploy on Railway/Fly.io (2 GB VM).

services:
  - type: web
    name: skillgap-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: skillgap-uploads
      mountPath: /data/uploads
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: ENABLE_LOCAL_SQLITE_FALLBACK
        value: "false"
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: UVICORN_WORKERS
        value: "1"
      - key: DATABASE_URL
        sync: false # Set in Render dashboard from Neon or Supabase PostgreSQL URI (?sslmode=require)
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        sync: false # Set to your exact Vercel domain, e.g. https://skillgap-ai.vercel.app
      - key: LLM_PROVIDER
        value: none # Optional: openai | gemini | none
      - key: LLM_API_KEY
        sync: false # Optional: set only if LLM_PROVIDER is openai or gemini
      - key: LLM_MODEL
        value: ""
